{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>{% block title %}Documate | Project documents{% endblock %}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link href="{% static 'css/portal.css' %}" rel="stylesheet">
</head>

<body>
<nav class="navbar navbar-expand bg-white border-bottom">
    <div class="container portal-container">
        <a class="navbar-brand d-flex align-items-center gap-2" href="{% url 'home' %}">
            <span class="brand-mark" aria-hidden="true">D</span>
            <span>Documate</span>
        </a>
        <span class="navbar-text d-none d-sm-inline">Project document management</span>
    </div>
</nav>

<main class="container portal-container py-4 py-md-5">
    {% block content %}
    {% endblock %}
</main>

<footer class="portal-footer">
    <div class="container portal-container">
        Documate <span aria-hidden="true">·</span> Construction project documents
    </div>
</footer>
</body>
</html>
