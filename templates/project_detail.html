<!DOCTYPE html>
<html>
<head>
    <title>{{ project.name }}</title>
</head>
<body>

    <a href="/">← Back</a>

    <h1>{{ project.name }}</h1>

    <p>
        Client:
        {{ project.client_name }}
    </p>

    <hr>

    <h2>Upload Document</h2>

    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}

        <input type="file" name="document_file" required>

        <button type="submit">
            Upload
        </button>
    </form>

    <hr>

    <h2>Documents</h2>

    {% for document in documents %}
        <div>
            {{ document.filename }}
        </div>
    {% empty %}
        <p>No documents uploaded.</p>
    {% endfor %}

</body>
</html>
