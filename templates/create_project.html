{% extends "base.html" %}

{% block title %}
New Project
{% endblock %}

{% block content %}

<a href="/" class="btn btn-sm btn-outline-secondary mb-3">
    ← Back
</a>

<h3 class="mb-4">
    Create Project
</h3>

<form method="POST">

    {% csrf_token %}

    <div class="mb-3">

        <label class="form-label">
            Project Name
        </label>

        {{ form.name }}

    </div>

    <div class="mb-3">

        <label class="form-label">
            Client Name
        </label>

        {{ form.client_name }}

    </div>

    <button
        type="submit"
        class="btn btn-primary">

        Create Project

    </button>

</form>

{% endblock %}
